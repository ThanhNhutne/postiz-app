name: Facebook Worker

on:
  push:
    paths:
      - 'apps/facebook-worker/**'
      - '.github/workflows/facebook-worker.yml'
  pull_request:
    paths:
      - 'apps/facebook-worker/**'
      - '.github/workflows/facebook-worker.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Install worker dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm install --prefix apps/facebook-worker --ignore-scripts
      - name: Syntax check
        run: npm --prefix apps/facebook-worker run build
      - name: Unit tests
        run: npm --prefix apps/facebook-worker test
      - name: Mock Redis / HTTP E2E
        run: npm --prefix apps/facebook-worker run test:e2e
      - name: Build worker container
        run: docker build -f apps/facebook-worker/Dockerfile -t postiz-facebook-worker:ci .
      - name: Validate Docker Compose
        env:
          FACEBOOK_WORKER_API_KEY: ci-test-key
          FACEBOOK_AUTOMATION_ENABLED: 'false'
          FACEBOOK_WORKER_MOCK: 'true'
        run: |
          docker compose config >/dev/null
          docker compose -f docker-compose.dev.yaml config >/dev/null
